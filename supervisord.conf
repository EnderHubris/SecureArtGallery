[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bun]
directory=/app/backend
command=sh -c "/usr/local/bin/bun install --frozen-lockfile && exec /usr/local/bin/bun run server.ts"
user=www-data
autostart=true
autorestart=true
stdout_logfile=/app/backend/log/bun.out.log
stderr_logfile=/app/backend/log/bun.err.log
